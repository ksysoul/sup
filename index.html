<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<title>디지털 결보강 대장 (v36.1 - 임시 교사 관리 추가)</title>

<style>

/* 원본 CSS 그대로 유지 */

:root{--primary:#2C3E50;--secondary:#ECF0F1;--accent:#3498DB;--border:#BDC3C7;--highlight:#E74C3C}

body{font-family:'Malgun Gothic',sans-serif;margin:0;padding:0;background:var(--secondary);color:#333}

header{background:var(--primary);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}

.header-title{font-size:20px;font-weight:bold}

#setup-screen{display:flex;flex-direction:column;align-items:center;padding:30px 20px}

.setup-box{background:white;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);width:100%;max-width:750px}

.setup-title{font-size:18px;font-weight:bold;color:var(--primary);margin-bottom:20px;border-bottom:2px solid var(--accent);padding-bottom:10px}

.day-select{padding:10px;font-size:16px;width:100%;border-radius:5px;border:2px solid var(--primary);margin-bottom:20px}

.file-section{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}

.file-card{border:1px solid var(--border);padding:15px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;background:#fafafa}

.btn-dl{background:#7f8c8d;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;margin-top:5px}

.upload-label{background:#27ae60;color:white;padding:8px 15px;border-radius:4px;cursor:pointer;font-weight:bold}

input[type=file]{display:none}

.status{font-size:12px;font-weight:bold;color:var(--highlight);margin-bottom:5px;display:block}

.status.ok{color:#27ae60}

button.primary-btn{background:var(--accent);color:white;border:none;padding:15px;border-radius:5px;cursor:pointer;font-weight:bold;width:100%;font-size:16px;opacity:.5;pointer-events:none;transition:.3s}

button.primary-btn.ready{opacity:1;pointer-events:auto}

#app{display:none;height:calc(100vh - 60px)}

#sidebar{width:320px;background:white;padding:20px;border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}

.checkbox-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;flex-grow:1;overflow-y:auto}

.absence-control{display:flex;align-items:center;gap:8px;font-size:13px}

.absence-control select{width:85px;padding:3px;font-size:12px}

#main{flex-grow:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column}

.tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)}

.tab{padding:10px 20px;cursor:pointer;font-weight:bold;background:#e0e0e0;border-radius:8px 8px 0 0;margin-right:5px}

.tab.active{background:var(--accent);color:white}

.tab-content{display:none;background:white;padding:20px;border-radius:0 8px 8px 8px;box-shadow:0 2px 5px rgba(0,0,0,.1);flex-grow:1}

.tab-content.active{display:block}

.btn-class{padding:6px 12px;margin:2px;border:1px solid var(--border);background:white;cursor:pointer;border-radius:4px}

.btn-class.active{background:var(--accent);color:white;border-color:var(--accent)}

table{width:100%;border-collapse:collapse;text-align:center;margin-top:15px}

th,td{border:1px solid var(--border);padding:10px;font-size:14px}

th{background:var(--primary);color:white}

select.assign-select{padding:8px;width:95%;border:1px solid #ccc;border-radius:4px}

.editable{cursor:pointer;background:#f9f9f9}.editable:hover{background:#e8f4f8}

button.action-btn{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;font-weight:bold}

button.del-btn{background:var(--highlight)}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}

#teacher-list-modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.4)}

.modal-content{background:#fefefe;margin:10% auto;padding:20px;border:1px solid #888;width:80%;max-width:500px;border-radius:8px}

.modal-list{max-height:400px;overflow-y:auto;border:1px solid #ddd;padding:10px}

.modal-item{padding:8px;cursor:pointer}.modal-item:hover{background:#f1f1f1}

#history-list{list-style-type:none;padding:0;max-height:500px;overflow-y:auto}

#history-list li{padding:10px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

#history-list li:hover{background:#f0f0f0}

.del-temp-btn{color:red;cursor:pointer;font-weight:bold;margin-left:5px}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<header><div class="header-title">💻 디지털 결보강 대장 (v36.1)</div><div id="header-info"></div></header>

<div id="setup-screen"><div class="setup-box">

<div class="setup-title">⚙️ 시스템 시작</div>

<div style="margin-bottom:20px;display:flex;gap:10px">

<button class="action-btn" style="background:#34495e" onclick="loadBaseData()">💾 저장된 명단/시간표 불러오기</button>

<button class="action-btn del-btn" onclick="clearLocalStorage()">🔥 모든 기록 초기화</button>

</div>

<select id="day-select" class="day-select" onchange="checkReady()">

<option value="">-- 오늘 배정할 요일을 선택하세요 --</option>

<option value="월">월요일</option><option value="화">화요일</option><option value="수">수요일</option><option value="목">목요일</option><option value="금">금요일</option>

</select>

<div class="file-section">

<div class="file-card"><div><strong>1. 교사 명렬표</strong><button class="btn-dl" onclick="downloadTpl('teacher')">양식</button></div><div><span class="status" id="status-teacher">❌</span><label class="upload-label"><input type="file" accept=".csv" onchange="uploadFile(event,'teacher')">업로드</label></div></div>

<div class="file-card"><div><strong>2. 학년별 시정표</strong><button class="btn-dl" onclick="downloadTpl('bell')">양식</button></div><div><span class="status" id="status-bell">❌</span><label class="upload-label"><input type="file" accept=".csv" onchange="uploadFile(event,'bell')">업로드</label></div></div>

<div class="file-card"><div><strong>3. 주간 전담 시간표</strong><button class="btn-dl" onclick="downloadTpl('spec')">양식</button></div><div><span class="status" id="status-spec">❌</span><label class="upload-label"><input type="file" accept=".csv" onchange="uploadFile(event,'spec')">업로드</label></div></div>

<div class="file-card"><div><strong>4. 학년별 수업 종료 교시</strong><button class="btn-dl" onclick="downloadTpl('weekly')">양식</button></div><div><span class="status" id="status-weekly">❌</span><label class="upload-label"><input type="file" accept=".csv" onchange="uploadFile(event,'weekly')">업로드</label></div></div>

</div>

<button class="primary-btn" id="btn-start" onclick="startApp()">✨ 배정 시작하기</button>

</div></div>

<div id="app">

<div id="sidebar">

<div class="section-title">🚫 오늘 결강/조퇴 교사</div>

<button class="action-btn" style="width:100%;margin-bottom:10px;font-size:12px;background:#27ae60" onclick="addTemporaryAbsent()">➕ 임시 교사 추가</button>

<div id="absent-list" class="checkbox-list"></div>

<div style="margin-top:auto">

<div class="section-title">💾 데이터 저장</div>

<button class="action-btn save-btn" style="width:100%" onclick="saveCurrentData()">💾 오늘 배정 결과 저장</button>

<button class="action-btn" style="width:100%;margin-top:10px;background:#7f8c8d" onclick="if(confirm('데이터를 저장하고 요일 선택 화면으로 돌아갈까요?')) { saveCurrentData(); location.reload(); }">🔄 요일 선택/재시작</button>

<button class="action-btn" style="width:100%;margin-top:10px" onclick="exportCSV()">엑셀 백업</button>

<!-- 👇 아래와 같이 기존 버튼들과 똑같은 class="action-btn" 스타일을 적용해야 보입니다! -->
<button class="action-btn" style="width:100%;margin-top:10px;background:#27ae60" onclick="exportHWPNotice()">📝 HWP 추출 (수정 가능)</button>
<button class="action-btn" style="width:100%;margin-top:10px;background:#2980b9" onclick="exportHWPImageNotice()">🖼️ HWP 추출 (모양 고정)</button>

</div>

</div>

<div id="main">

<div class="tabs">

<div class="tab active" onclick="switchTab('assignTab',this)">📅 오늘 배정</div>

<div class="tab" onclick="switchTab('historyTab',this)">📖 과거 기록 조회/수정</div>

</div>

<div id="assignTab" class="tab-content active">

<div id="grade-buttons" style="margin-bottom:20px"></div>

<div id="timetable-area" style="display:none">

<div class="toolbar">
    <h3 id="selected-class-title" style="margin:0"></h3>
    <div>
        <button class="action-btn" style="background:#27ae60; margin-right:5px;" onclick="exportCurrentClassImage()">🖼️ 이미지 저장</button>
        <button class="action-btn" onclick="runAutoAssign()">✨ 일괄 배정</button>
    </div>
</div>
3단계: 자바스크

<table><thead><tr><th>교시</th><th>시간</th><th>배정 선생님</th></tr></thead><tbody id="timetable-body"></tbody></table>

</div>

</div>

<div id="historyTab" class="tab-content"><h3>과거 결보강 기록 목록</h3><p>날짜를 클릭하면 해당 날짜의 배정 화면으로 전환됩니다.</p><ul id="history-list"></ul></div>

</div>

</div>

<div id="teacher-list-modal"><div class="modal-content"><span onclick="closeModal()" style="float:right;font-size:20px;cursor:pointer">&times;</span><h3>전체 교사 명단에서 선택</h3><div id="modal-teacher-list" class="modal-list"></div></div></div>



<script>

let appData={teachers:[],bellSchedule:{},specSchedule:{},weeklyMax:{},absentRecords:{},assignRecords:{}};

let targetDayStr='',filesLoaded={teacher:false,bell:false,spec:false,weekly:false};

let idCounter=100,currentModalTarget=null,currentGrade='',currentClass='';

const PERIOD_MAP={'1교시':1,'2교시':2,'3교시':3,'4교시':4,'5교시':5,'6교시':6,'점심':7};

const BOM="\uFEFF";

function selectTeacher(teacherId, selectElement) {
    const t = appData.teachers.find(x => x.id === teacherId);
    if (!t) return;

    // 카운트 증가 (점심 여부 체크)
    if (selectElement.id.includes('점심')) {
        t.lunchCount++;
    } else {
        t.regCount++;
    }

    // 변경된 카운트가 즉시 반영되도록 UI 전체를 새로 고침
    // 현재 배정 중인 학급 정보를 유지하며 선택지 갱신
    runAutoAssign(); 
    
    alert(`${t.name} 선생님 배정 완료! (누적: ${t.regCount + t.lunchCount}회)`);
}

// [추가된 기능]

function addTemporaryAbsent(){

    const name=prompt("교사 이름을 입력하세요:"); if(!name)return;

    const newId='T'+Date.now();

    appData.teachers.push({id:newId,name:name,grade:'임시',class:'0',role:'일반',regCount:0,lunchCount:0,isTemp:true});

    renderAbsentList();

}

function deleteTempTeacher(id){

    appData.teachers=appData.teachers.filter(t=>t.id!==id);

    renderAbsentList();

}



function incrementCount(teacherId, isLunch) {

    const t = appData.teachers.find(x => x.id === teacherId);

    if(t) { if(isLunch) t.lunchCount++; else t.regCount++; }

}



function loadBaseData(){

    if(!confirm("기존에 업로드했던 명단과 시간표를 불러옵니다."))return;

    appData.teachers=JSON.parse(localStorage.getItem('hc_base_teachers')||'[]');

    appData.bellSchedule=JSON.parse(localStorage.getItem('hc_base_bell')||'{}');

    appData.specSchedule=JSON.parse(localStorage.getItem('hc_base_spec')||'{}');

    appData.weeklyMax=JSON.parse(localStorage.getItem('hc_base_weekly')||'{}');

    filesLoaded={teacher:true,bell:true,spec:true,weekly:true};

    checkReady();

    alert("데이터 로드 완료.");

    ['teacher','bell','spec','weekly'].forEach(t=>{document.getElementById(`status-${t}`).innerText="✅ (저장됨)";document.getElementById(`status-${t}`).className="status ok";});

}



function saveCurrentData(){

    syncCurrentData();

    const today=new Date().toISOString().split('T')[0];

    localStorage.setItem(`hc_record_${today}`,JSON.stringify(appData));

    localStorage.setItem('hc_base_teachers',JSON.stringify(appData.teachers));

    localStorage.setItem('hc_base_bell',JSON.stringify(appData.bellSchedule));

    localStorage.setItem('hc_base_spec',JSON.stringify(appData.specSchedule));

    localStorage.setItem('hc_base_weekly',JSON.stringify(appData.weeklyMax));

    alert(`[${today}] 데이터가 저장되었습니다.`);

    loadHistoryList();

}



function clearLocalStorage(){if(confirm("모든 데이터 삭제?")){{localStorage.clear();location.reload();}}}

function downloadTpl(type){

    let content="",filename="";

    if(type==='teacher'){filename="1_명렬표.csv";content="이름,학년구분,반,직책,정규보강,점심보강\n\"김나현(영,실)\",전담,5,전담,0,0";}

    else if(type==='bell'){filename="2_시정표.csv";content="학년,1시작,1종료,2시작,2종료,3시작,3종료,4시작,4종료,5시작,5종료,6시작,6종료,점심시작,점심종료\n1,09:00,09:40,09:50,10:30,10:40,11:20,12:20,13:00,,,,11:20,12:20";}

    else if(type==='spec'){filename="3_전담시간표.csv";content='교사명,월1,월2,월3,월4,월5,월6,화1,화2,화3,화4,화5,화6\n"신재일(체육)",6-8,6-7,,6-6,6-5,,6-1,6-2,,6-3,6-4';}

    else if(type==='weekly'){filename="4_수업종료교시.csv";content="학년,월,화,수,목,금\n1,6,6,5,6,6\n2,6,6,6,6,6";}

    const blob=new Blob([BOM+content],{type:'text/csv;charset=utf-8;'});

    const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=filename;link.click();

}



function timeToMins(t){return t&&t.includes(':')?parseInt(t.split(':')[0])*60+parseInt(t.split(':')[1]):null;}

function parseCSV(text){

    const rows=[];let currentRow=[],currentField='',inQuotes=false;

    text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

    for(let i=0;i<text.length;i++){

        const char=text[i];

        if(char==='"'&&(i===0||text[i-1]!=='\\')){inQuotes=!inQuotes;continue;}

        if((char===','||char==='\n')&&!inQuotes){currentRow.push(currentField.trim());currentField='';if(char==='\n'){if(currentRow.length>1||currentRow[0]!=='')rows.push(currentRow);currentRow=[];}}

        else{currentField+=char;}

    }

    if(currentField)currentRow.push(currentField.trim());

    if(currentRow.length>0&&(currentRow.length>1||currentRow[0]!==''))rows.push(currentRow);

    return rows;

}

function uploadFile(event,type){

    const file=event.target.files[0];if(!file)return;

    const reader=new FileReader();

    reader.onload=e=>{

        const data=parseCSV(e.target.result);if(data.length<1)return alert("데이터 부족");

        try{

            if(type==='teacher')parseTeacher(data);

            if(type==='bell')parseBell(data);

            if(type==='spec')parseSpec(data);

            if(type==='weekly')parseWeekly(data);

            document.getElementById(`status-${type}`).innerText="✅";

            document.getElementById(`status-${type}`).className="status ok";

            filesLoaded[type]=true;checkReady();

        }catch(err){alert("파일 형식 오류!");}

    };

    reader.readAsText(file,"EUC-KR");

}



function parseWeekly(data){

    appData.weeklyMax={};

    data.slice(1).forEach(row=>{

        let g=row[0];

        appData.weeklyMax[g]={'월':parseInt(row[1]),'화':parseInt(row[2]),'수':parseInt(row[3]),'목':parseInt(row[4]),'금':parseInt(row[5])};

    });

}



function normalize(str){return str?str.replace(/$.*?$/g,'').replace(/["'=\s]/g,''):"";}

function normalizeClassStr(str){if(!str)return"";let clean=str.replace(/[^0-9-]/g,'');if(!clean.includes('-'))return clean;let parts=clean.split('-');return`${parseInt(parts[0])||0}-${parseInt(parts[1])||0}`;}

function parseTeacher(data){ appData.teachers=[];idCounter=100; data.slice(1).forEach(c=>{if(c.length>=4)appData.teachers.push({id:'T'+(idCounter++),name:c[0],grade:c[1],class:c[2],role:c[3],regCount:parseInt(c[4])||0,lunchCount:parseInt(c[5])||0});}); }

function parseBell(data){ appData.bellSchedule={}; data.slice(1).forEach(c=>{ let g=normalize(c[0]); if(!g)return; appData.bellSchedule[g]={}; ['1교시','2교시','3교시','4교시','5교시','6교시'].forEach((p,idx)=>{ let st=timeToMins(c[idx*2+1]),ed=timeToMins(c[idx*2+2]); if(st&&ed)appData.bellSchedule[g][p]={start:st,end:ed}; }); let ls=timeToMins(c[13]),le=timeToMins(c[14]); if(ls&&le)appData.bellSchedule[g]['점심']={start:ls,end:le}; }); }

function parseSpec(data){ appData.specSchedule={'월':{},'화':{},'수':{},'목':{},'금':{}}; const header=data[0]; const nameIndex=header.findIndex(h=>normalize(h).includes('교사')); if(nameIndex===-1)throw new Error("열 오류"); data.slice(1).forEach(row=>{ const name=row[nameIndex]; if(!name)return; ['월','화','수','목','금'].forEach(day=>{ if(!appData.specSchedule[day])appData.specSchedule[day]={}; appData.specSchedule[day][name]={}; for(let p=1;p<=6;p++){ const colIndex=header.findIndex(h=>normalize(h)===(day+p)); if(colIndex>-1&&colIndex<row.length){ const classData=normalizeClassStr(row[colIndex]); if(classData)appData.specSchedule[day][name][p+'교시']=classData; } } }); }); }



function checkReady(){ const btn=document.getElementById('btn-start'); targetDayStr=document.getElementById('day-select').value; if(filesLoaded.teacher&&filesLoaded.bell&&filesLoaded.spec&&filesLoaded.weekly&&targetDayStr)btn.classList.add('ready'); else btn.classList.remove('ready'); }

function startApp(){ targetDayStr=document.getElementById('day-select').value; if(!targetDayStr||!filesLoaded.teacher||!filesLoaded.bell||!filesLoaded.spec||!filesLoaded.weekly)return alert("입력 정보 부족"); document.getElementById('header-info').innerHTML=`오늘: <b>${new Date().toLocaleDateString()} (${targetDayStr})</b>`; document.getElementById('setup-screen').style.display='none'; document.getElementById('app').style.display='flex'; renderClassBtns(); renderAbsentList(); loadHistoryList(); }

function switchTab(tabId,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));el.classList.add('active');document.getElementById(tabId).classList.add('active');}



function renderClassBtns(){ let box=document.getElementById('grade-buttons'); box.innerHTML=''; let classCounts={}; appData.teachers.forEach(t=>{if(!isNaN(t.grade)&&t.grade!==''){let c=parseInt(t.class)||0;if(!classCounts[t.grade]||c>classCounts[t.grade])classCounts[t.grade]=c;}}); Object.keys(classCounts).sort().forEach(g=>{ let html=`<div style="margin-bottom:5px"><strong>${g}학년:</strong> `; for(let c=1;c<=classCounts[g];c++)html+=`<button class="btn-class" onclick="selectClass('${g}','${c}',this)">${c}반</button>`; box.innerHTML+=html+'</div>'; }); }

function renderAbsentList(){ 

    let box=document.getElementById('absent-list'); box.innerHTML=''; 

    appData.teachers.forEach(t=>{ 

        if(t.role==='교장'||t.role==='교감')return; 

        const savedAbsence=appData.absentRecords[t.id]; 

        const isChecked=savedAbsence?'checked':''; 

        const selectedPeriod=savedAbsence||1; 

        const delBtn=t.isTemp?`<span class="del-temp-btn" onclick="deleteTempTeacher('${t.id}')">[X]</span>`:'';

        let display=t.role==='전담'?`[전담] ${t.name}`:`${t.grade}-${t.class} ${t.name}`; 

        box.innerHTML+=`<div class="absence-control"><input type="checkbox" id="absent-${t.id}" value="${t.id}" ${isChecked} onchange="syncAbsence()"><label for="absent-${t.id}">${display}${delBtn}</label><select id="start-period-${t.id}" onchange="syncAbsence()">${Object.keys(PERIOD_MAP).map(p=>`<option value="${PERIOD_MAP[p]}" ${PERIOD_MAP[p]===selectedPeriod?'selected':''}>${p}부터</option>`).join('')}</select></div>`; 

    }); 

}

function syncAbsence(){ appData.absentRecords={}; document.querySelectorAll('.absence-control input:checked').forEach(c=>{appData.absentRecords[c.value]=parseInt(document.getElementById(`start-period-${c.value}`).value);}); }

function getTeacherTier(teacher,periodName,targetTime,todaySpec,absentRecords,targetGrade){ if(absentRecords[teacher.id]&&PERIOD_MAP[periodName]>=absentRecords[teacher.id])return 0; if(teacher.role==='교장'||teacher.role==='교감')return 4; const lunchTime=appData.bellSchedule[teacher.grade]?appData.bellSchedule[teacher.grade]['점심']:null; if(lunchTime&&targetTime.start<lunchTime.end&&targetTime.end>lunchTime.start)return 0; if(periodName==='점심')return(teacher.grade===targetGrade)?1:3; if(teacher.role==='전담'){if(!todaySpec[teacher.name]||!todaySpec[teacher.name][periodName])return(teacher.grade===targetGrade)?2:3;return 0;} if(teacher.role==='일반'){const myClassStr=`${teacher.grade}-${teacher.class}`;for(const specName in todaySpec){if(todaySpec[specName][periodName]===myClassStr)return(teacher.grade===targetGrade)?1:3;}return 0;} return 0; }



function runAutoAssign(){
    if(!currentGrade) return; 
    syncAbsence(); 
    const targetTeacher = appData.teachers.find(t=>t.grade===currentGrade && t.class===currentClass);
    if(!targetTeacher) return alert("담임 없음"); 
    
    let maxP = appData.weeklyMax[currentGrade]?.[targetDayStr] || 6;
    let scheduleObj = appData.bellSchedule[currentGrade]; 
    let todaySpec = appData.specSchedule[targetDayStr] || {}; 
    let validPeriods = Object.keys(scheduleObj).map(p=>({name:p, start:scheduleObj[p].start})).sort((a,b)=>a.start-b.start);

    validPeriods.forEach(period => {
        if(PERIOD_MAP[period.name] > maxP && period.name !== '점심') return; 
        
        const sel = document.getElementById(`sel-${period.name}`);
        // targetAbsenceStart 변수 정의 추가
        const targetAbsenceStart = appData.absentRecords[targetTeacher.id];

        if(targetAbsenceStart && PERIOD_MAP[period.name] < targetAbsenceStart){ 
            sel.innerHTML = `<option value="${targetTeacher.name}(정상)">${targetTeacher.name} (정상)</option>`; 
            return; 
        }

        sel.innerHTML = ''; 
        let targetTime = scheduleObj[period.name]; 
        let tier1=[], tier2=[], tier3=[], tier4=[];

        appData.teachers.forEach(t => {
            if(t.id === targetTeacher.id) return;
            
            // [중복 배정 방지 로직]
            let isAlreadyAssigned = false;
            // appData.assignRecords가 존재하는지 확인
            if (appData.assignRecords) {
                for (const classKey in appData.assignRecords) {
                    if (appData.assignRecords[classKey] && appData.assignRecords[classKey][period.name] === t.id) {
                        isAlreadyAssigned = true;
                        break;
                    }
                }
            }
            if (isAlreadyAssigned) return;

            const tier = getTeacherTier(t, period.name, targetTime, todaySpec, appData.absentRecords, currentGrade);
            if(tier > 0) {
                if(tier === 1) tier1.push(t); 
                else if(tier === 2) tier2.push(t); 
                else if(tier === 3) tier3.push(t); 
                else if(tier === 4) tier4.push(t); 
            }
        });

        const sortFn = (a,b) => (period.name==='점심' ? a.lunchCount-b.lunchCount : a.regCount-b.regCount);
        tier1.sort(sortFn); tier2.sort(sortFn); tier3.sort(sortFn); tier4.sort((a,b) => a.role==='교감' ? -1 : 1);
        
        let rk = 1;
        const addOpts = (lst, lbl) => lst.forEach(c => sel.add(new Option(`${rk++}순위 [${lbl}] ${c.name} (${c.regCount+c.lunchCount}회)`, c.id)));
        addOpts(tier1,'동학년'); addOpts(tier2,'동학년전담'); addOpts(tier3,'타학년/전담'); addOpts(tier4,'관리자');
        sel.add(new Option('--- [전체 명단] ---', 'ALL'));
    });
const selects = document.querySelectorAll('.assign-select');
    selects.forEach(sel => {
        const teacherId = sel.value;
        if (teacherId && teacherId !== 'ALL') {
            // 해당 교사의 누적 횟수를 실제 선택된 값에 맞춰 동기화
            // 이미 카운트가 올라갔는지 체크하고, 안 올라갔다면 올림 (간단한 방법)
            incrementCount(teacherId, sel.id.includes('점심'));
        }
    });
    syncCurrentData();
}

document.addEventListener('change', function(e) {
    if(e.target.classList.contains('assign-select')) {
        const teacherId = e.target.value;
        
        // 1. '--- [전체 명단] ---'을 선택한 경우: 학년/직책별로 그룹화하여 목록 생성
        if (teacherId === 'ALL') {
            const sel = e.target;
            sel.innerHTML = '<option value="">-- 교사 선택 --</option>';
            
            // 학년/직책 순서 정의 (1~6학년 담임 먼저, 그 후 전담 및 기타 직책)
            const gradeOrder = ['1', '2', '3', '4', '5', '6', '전담', '보건', '영양', '사서', '행정', '임시', '기타'];
            
            // 그룹별로 교사 분류
            const grouped = {};
            appData.teachers.forEach(t => {
                let key = t.grade;
                if (!gradeOrder.includes(key)) key = '기타';
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(t);
            });
            
            // 각 그룹 내부를 이름순(가나다순)으로 정렬
            Object.keys(grouped).forEach(key => {
                grouped[key].sort((a, b) => a.name.localeCompare(b.name));
            });
            
            // 정렬된 순서대로 드롭다운에 그룹별 옵션 추가
            gradeOrder.forEach(gKey => {
                if (grouped[gKey] && grouped[gKey].length > 0) {
                    // 구분선 역할을 하는 비활성화 옵션 추가
                    const groupLabel = !isNaN(gKey) ? `--- [ ${gKey}학년 ] ---` : `--- [ ${gKey} ] ---`;
                    const dividerOpt = new Option(groupLabel, '');
                    dividerOpt.disabled = true;
                    sel.add(dividerOpt);
                    
                    // 해당 그룹의 교사들 추가
                    grouped[gKey].forEach(t => {
                        const roleLabel = t.role === '일반' ? `${t.grade}-${t.class}반` : t.role;
                        const optText = `&nbsp;&nbsp;&nbsp;${t.name} (${roleLabel}, 누적: ${t.regCount + t.lunchCount}회)`;
                        
                        // option 객체 생성 후 텍스트 밀어쓰기 적용
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.innerHTML = optText; // 들여쓰기 가독성을 위해 innerHTML 활용
                        sel.add(opt);
                    });
                }
            });
            return;
        }

        // 2. 실제 선생님을 선택한 경우: 카운트 증가 및 데이터 동기화 수행
        if(teacherId && teacherId !== '') {
            const isLunch = e.target.id.includes('점심');
            incrementCount(teacherId, isLunch);
            syncCurrentData();
        }
    }
});

                                    <th style="width: 20%; border: 1px solid #BDC3C7; padding: 10px; font-size: 14px; background: #2C3E50; color: white;">교시</th>
                                    <th style="width: 30%; border: 1px solid #BDC3C7; padding: 10px; font-size: 14px; background: #2C3E50; color: white;">시간</th>
                                    <th style="width: 50%; border: 1px solid #BDC3C7; padding: 10px; font-size: 14px; background: #2C3E50; color: white;">배정 선생님</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                        <div style="margin-top: 20px; border: 2px solid #2C3E50; background: #fcfcfc; padding: 15px; border-radius: 6px; font-size: 13px; line-height: 1.6; color: #2C3E50;">
                            위와 같이 당일 결보강 수업을 운영하오니 해당 학급 및 교사께서는 수업에 차질 없으시기 바랍니다.<br>
                            바쁘실텐데 시간 내주셔서 진심으로 감사드립니다~~!<br>
                            학년 선생님들께서도 잘 챙겨주시기 바랍니다^^ 오늘도 좋은 하루 되세요!<br>
                            <b>(마지막 시간에는 컴퓨터 전원과 문단속도 부탁드립니다.)</b>
                        </div>
                    </div>
                `;

                // html2canvas 이용해 고해상도 이미지 변환
                const canvas = await html2canvas(tempContainer.firstElementChild, { scale: 2 });
                const imgData = canvas.toDataURL('image/png');

               imagesHtml += `
                    <div style="page-break-before: always; clear: both; text-align: center; margin-top: 20px;">
                        <img src="${imgData}" style="width: 75%; max-width: 520px; height: auto; border: 1px solid #ccc;" />
                    </div>
                `;
            }
        }
    }

    document.body.removeChild(tempContainer);

    if (!hasData) {
        return alert("저장되거나 배정된 결보강 데이터가 없습니다. 먼저 배정을 진행해 주세요.");
    }

    let finalDocHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40' lang="ko">
        <head><meta charset="UTF-8"></head>
        <body style="margin:0; padding:0;">
            ${imagesHtml}
        </body>
        </html>
    `;

    const blob = new Blob(["\uFEFF" + finalDocHtml], { type: 'application/vnd.ms-word;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `결보강현황_${targetDayStr}요일(수정불가_모양고정).doc`;
    link.click();
}
function exportCurrentClassImage() {
    if(!currentGrade || !currentClass) {
        return alert("먼저 배정 탭에서 학급을 선택해 주세요.");
    }
    
    // 현재 입력된 데이터 동기화
    syncCurrentData();
    
    // 캡처할 대상 영역 (선택된 학급의 시간표 영역)
    const targetArea = document.getElementById('timetable-area');
    
    // 선명하게(고해상도) 캡처하기 위해 scale 옵션 부여
    html2canvas(targetArea, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = `결보강_${currentGrade}학년_${currentClass}반_${targetDayStr}요일.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>
